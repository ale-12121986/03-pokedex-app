<ion-header [translucent]="true">
  <!--<ion-toolbar>
    <ion-title>list-pokemons</ion-title>
  </ion-toolbar>-->
</ion-header>

<ion-content [fullscreen]="true">
<!--<pre>{{ pokemons | json }}</pre>-->
@for(pokemon of pokemons; track pokemon.id){
  <ion-grid>
    <ion-row class = "ion-align-items-center border-bottom" (click) = "goDetail(pokemon)">
      <ion-col size="3">
        <ion-img [src] = "pokemon.sprite" />
      </ion-col>
      <ion-col size="4">
        <ion-text class = "ion-text-capitalize">{{pokemon.name}}</ion-text>
      </ion-col>
      <ion-col size = "2">
        <ion-img [src] = "'assets/img/' + pokemon.type1 +  '.gif'" />
      </ion-col>
      <ion-col size = "2">
        @if(pokemon.type2 != null){
          <ion-img [src] = "'assets/img/' + pokemon.type2 +  '.gif'" />
        }
        
      </ion-col>    
    </ion-row>
  
  </ion-grid>
  }
  <ion-infinite-scroll threshold="50px" (ionInfinite)="morePokemons($event)">
    <ion-infinite-scroll-content loadingText="Please wait..." loadingSpinner="bubbles"></ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
