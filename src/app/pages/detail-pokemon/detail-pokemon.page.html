<ion-content [fullscreen]="true">

    @if(pokemon){
        <ion-img [src] = "pokemon.sprite"/>

        <ion-card>
            
                <ion-card-header class = "ion-text-capitalize">
                    <ion-card-title>{{pokemon.name}}</ion-card-title>
                </ion-card-header>

            <ion-card-content>
                <ion-grid>
                    <ion-row class = "ion-align-items-center">
                        <ion-col>
                            <ion-text>tipo</ion-text>
                        </ion-col>
                        <ion-col>
                            <ion-img class = "ion-padding-start ion-padding-end" [src] ="'assets/img/' + pokemon.type1 + '.gif' "/>
                        </ion-col>
                        
                        <ion-col>
                            @if(pokemon.type2){
                                <ion-img class = "ion-padding-start ion-padding-end" [src] ="'assets/img/' + pokemon.type2 + '.gif' "/>    
                            }
                        </ion-col>
                    </ion-row>

                    <ion-row>
                        <ion-col>
                            <ion-text>Peso</ion-text>
                        </ion-col>
                        <ion-col>
                            <ion-text>{{pokemon.weight}} Kg</ion-text>
                        </ion-col>
                        <ion-col>
                            <ion-text>Altura</ion-text>
                        </ion-col>
                        <ion-col>
                            <ion-text>{{pokemon.height}} m</ion-text>
                        </ion-col>
                    </ion-row>
                </ion-grid>    
            </ion-card-content>
        </ion-card>

        <ion-card>
            
                <ion-card-header class = "ion-text-capitalize">
                    <ion-card-title>Habilidades</ion-card-title>
                </ion-card-header>

            <ion-card-content>
                <ion-grid>
                    <ion-row class = "ion-align-items-center">
                    <ion-col size="5">
                        <ion-text>Principal</ion-text>                        
                    </ion-col>
                    <ion-col size="7" class=" ion-text-end">
                        @for(hability of pokemon.abilities; track hability){
                            <ion-text>
                            <div>{{hability}}</div>    
                            </ion-text>
                        }
                        
                    </ion-col>
                </ion-row>
                @if(pokemon.hiddenAbilities){
                    <ion-row>
                        <ion-col size="5">
                            <ion-text>Oculta</ion-text>
                        </ion-col>
                        <ion-col size="7" class="ion-text-end">
                            <ion-text>{{pokemon.hiddenAbilities}}</ion-text>
                        </ion-col>
                    </ion-row>
                }
                </ion-grid>
                
            </ion-card-content>
        </ion-card>

    }

  <ion-fab slot="fixed" vertical="top" horizontal="end">
    <ion-fab-button (click) = "goBack()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
